<title>Italiano Roadmap</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
  /* Layout: one reading column; a milestone track on top, "up next" below it, then one block per milestone with feature cards. */
  :root {
    --bg: #f2f4f6;
    --surface: #ffffff;
    --ink: #1c2530;
    --muted: #5a6776;
    --line: #dce2e8;
    --accent: #24598a;
    --done: #2e7a4c;
    --build: #a8690f;
    --wait: #8592a1;
    --you: #7046a8;
    --done-soft: #e3f1e8;
    --build-soft: #f8ecd6;
    --you-soft: #efe7f8;
    --accent-soft: #e2ecf5;
    --display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --body: "Inter", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #11161c; --surface: #19212a; --ink: #e4e9ee; --muted: #9ba7b4; --line: #2a3440;
      --accent: #78ade0; --done: #5fc08a; --build: #e3aa4f; --wait: #707e8d; --you: #b994ee;
      --done-soft: #1b3326; --build-soft: #3a2c14; --you-soft: #2c2240; --accent-soft: #1c2c3d;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #11161c; --surface: #19212a; --ink: #e4e9ee; --muted: #9ba7b4; --line: #2a3440;
    --accent: #78ade0; --done: #5fc08a; --build: #e3aa4f; --wait: #707e8d; --you: #b994ee;
    --done-soft: #1b3326; --build-soft: #3a2c14; --you-soft: #2c2240; --accent-soft: #1c2c3d;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.5; }
  .wrap {
    max-width: 860px; margin: 0 auto;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 28px 48px;
    display: flex; flex-direction: column; gap: 28px;
  }
  .wrap > * { min-width: 0; }
  h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; line-height: 1.15; }
  h1 { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 700; letter-spacing: -0.01em; }
  h2 { font-size: 1.35rem; font-weight: 700; }
  h3 { font-size: 1.02rem; font-weight: 500; }
  p { margin: 0; }
  a { color: var(--accent); }
  a:focus-visible, summary:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .eyebrow { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .muted { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; }

  header { display: flex; flex-direction: column; gap: 10px; }
  .summary { font-size: 1.05rem; max-width: 62ch; }
  .updated { font-size: 0.85rem; color: var(--muted); }

  /* Milestone track */
  .track-scroll { overflow-x: auto; margin-inline: -4px; padding: 4px; }
  .track { display: grid; grid-template-columns: repeat(var(--stops), minmax(118px, 1fr)); gap: 0; min-width: min-content; list-style: none; margin: 0; padding: 0; }
  .stop { position: relative; display: flex; flex-direction: column; gap: 6px; padding-right: 12px; }
  .stop a { text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; }
  .stop::before { content: ""; position: absolute; top: 11px; left: 24px; right: 0; height: 2px; background: var(--line); }
  .stop:last-child::before { display: none; }
  .stop.done::before { background: var(--done); }
  .dot { position: relative; z-index: 1; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--wait); background: var(--bg); display: grid; place-items: center; font-size: 13px; font-weight: 700; color: var(--surface); }
  .stop.done .dot { background: var(--done); border-color: var(--done); }
  .stop.active .dot { border-color: var(--build); background: var(--build-soft); }
  .stop.active .dot::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--build); }
  .stop.current .dot { box-shadow: 0 0 0 4px var(--build-soft); }
  .stop-id { font-family: var(--display); font-weight: 700; font-size: 1rem; }
  .stop-name { font-size: 0.82rem; color: var(--muted); line-height: 1.3; }
  .stop-count { font-size: 0.78rem; color: var(--muted); }

  /* Up next */
  .next { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .next-groups { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(240px, 100%), 1fr)); gap: 16px; }
  .next-group { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .next-group h3 { font-size: 0.9rem; display: flex; align-items: center; gap: 8px; }
  .next-group ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
  .next-group li { font-size: 0.9rem; }
  .empty { font-size: 0.88rem; color: var(--muted); }

  /* Milestones */
  .milestone { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; scroll-margin-top: 16px; }
  .milestone > summary { list-style: none; cursor: pointer; padding: 18px; display: flex; flex-direction: column; gap: 10px; }
  .milestone > summary::-webkit-details-marker { display: none; }
  .ms-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
  .ms-title { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .chev { flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); border: 1px solid var(--line); transition: transform 0.2s; }
  .milestone[open] .chev { transform: rotate(180deg); }
  .bar { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar > span { display: block; height: 100%; background: var(--build); border-radius: 99px; }
  .bar.full > span { background: var(--done); }
  .bar.small { height: 5px; }
  .ms-meta { display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; font-size: 0.88rem; color: var(--muted); }
  .ms-body { padding: 0 18px 18px; display: flex; flex-direction: column; gap: 16px; }
  .goal { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr)); }
  .goal div { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
  .goal p { font-size: 0.92rem; }

  .pill { display: inline-flex; align-items: center; gap: 5px; font-size: 0.75rem; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; }
  .pill.done { background: var(--done-soft); color: var(--done); }
  .pill.active { background: var(--build-soft); color: var(--build); }
  .pill.planned { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

  /* Features: one numbered column in build order, joined by a line */
  .order-note { font-size: 0.86rem; color: var(--muted); }
  .features { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
  .step { display: grid; grid-template-columns: 30px 1fr; gap: 12px; position: relative; }
  .step::before { content: ""; position: absolute; left: 14px; top: 32px; bottom: -12px; width: 2px; background: var(--line); }
  .step:last-child::before { display: none; }
  .step-num { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-family: var(--display); font-weight: 700; font-size: 0.9rem; border: 2px solid var(--wait); color: var(--muted); background: var(--surface); position: relative; z-index: 1; }
  .step.done .step-num { background: var(--done); border-color: var(--done); color: var(--surface); }
  .step.active .step-num { background: var(--build-soft); border-color: var(--build); color: var(--build); }
  .feature { border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
  .feature-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
  .feature-head .right { display: flex; align-items: center; gap: 8px; }
  .gh-links { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 0.86rem; }
  .scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px, 100%), 1fr)); gap: 10px; }
  .scope .feature { gap: 4px; }
  .feature-about { font-size: 0.86rem; color: var(--muted); }
  .issues { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .issue { display: grid; grid-template-columns: 18px 1fr; gap: 8px; align-items: start; font-size: 0.9rem; }
  .issue .text { min-width: 0; display: flex; flex-wrap: wrap; gap: 2px 8px; align-items: baseline; }
  .issue.done .label { color: var(--muted); }
  .issue .sub { font-size: 0.78rem; color: var(--muted); }
  .issue a.ref { font-size: 0.78rem; color: var(--muted); text-decoration: none; }
  .issue a.ref:hover { text-decoration: underline; }
  .icon { width: 16px; height: 16px; margin-top: 3px; border-radius: 50%; display: grid; place-items: center; }
  .icon.done { background: var(--done); }
  .icon.done::after { content: ""; width: 4px; height: 8px; border: solid var(--surface); border-width: 0 2px 2px 0; transform: translateY(-1px) rotate(45deg); }
  .icon.building { border: 2px solid var(--build); }
  .icon.building::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--build); }
  .icon.ready { border: 2px solid var(--accent); }
  .icon.waiting { border: 2px dashed var(--wait); }
  .you { font-size: 0.7rem; font-weight: 600; padding: 1px 7px; border-radius: 99px; background: var(--you-soft); color: var(--you); }

  .sketch { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 4px; font-size: 0.92rem; }
  .legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 0.8rem; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend .icon { margin-top: 0; }
  .later { display: flex; flex-direction: column; gap: 8px; }
  footer { font-size: 0.8rem; color: var(--muted); }
  .error { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 18px; }
  @media (prefers-reduced-motion: reduce) { .chev { transition: none; } }
</style>

<div class="wrap" id="app">
  <header>
    <span class="eyebrow">Italiano · Roadmap</span>
    <h1>Where the app stands</h1>
    <p class="summary muted">Loading the latest status…</p>
  </header>
</div>

<script>
(function () {
  const app = document.getElementById("app");
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const pct = (c) => (c.total ? Math.round((c.done / c.total) * 100) : 0);
  // Grey track when nothing is done, orange while under way, green only at 100%.
  const bar = (c, small) => `<div class="bar${small ? " small" : ""}${c.total && c.done === c.total ? " full" : ""}" aria-hidden="true"><span style="width:${pct(c)}%"></span></div>`;
  const stateOf = (c) => (c.total && c.done === c.total ? "done" : c.done > 0 ? "active" : "planned");
  const FEATURE_STATE = { done: "Done", active: "In progress", planned: "Not started" };
  const STATE = { done: "Done", active: "In progress", planned: "Planned" };
  const STATUS = { done: "Done", building: "Being built", ready: "Ready to start", waiting: "Waiting" };

  function issueRow(i) {
    let sub = "";
    if (i.status === "waiting" && i.waitingOn.length) sub = `after ${i.waitingOn.map((n) => "#" + n).join(", ")}`;
    else if (i.status === "waiting") sub = "needs triage";
    else if (i.status === "building") sub = "being built now";
    else if (i.status === "ready") sub = i.mine ? "your turn" : "ready to start";
    return `<li class="issue ${i.status}">
      <span class="icon ${i.status}" role="img" aria-label="${STATUS[i.status]}"></span>
      <span class="text">
        <span class="label">${esc(i.label || i.title)}</span>
        ${i.mine ? '<span class="you">You</span>' : ""}
        <a class="ref" href="${esc(i.url)}" target="_blank" rel="noopener" title="${esc(i.title)}">#${i.n}</a>
        ${sub ? `<span class="sub">${esc(sub)}</span>` : ""}
      </span>
    </li>`;
  }

  function featureStep(f, idx) {
    const st = stateOf(f.counts);
    return `<li class="step ${st}">
      <span class="step-num num" aria-label="Step ${idx + 1}">${st === "done" ? "✓" : idx + 1}</span>
      <article class="feature">
        <div class="feature-head">
          <h3>${esc(f.name)}</h3>
          <span class="right"><span class="pill ${st}">${FEATURE_STATE[st]}</span><span class="muted num" style="font-size:.82rem">${f.counts.done}/${f.counts.total}</span></span>
        </div>
        ${bar(f.counts, true)}
        <p class="feature-about">${esc(f.about)}</p>
        <ul class="issues">${f.issues.map(issueRow).join("")}</ul>
      </article>
    </li>`;
  }

  function ghLinks(m) {
    const links = [];
    if (m.epic) links.push(`<a href="${esc(m.epic.url)}" target="_blank" rel="noopener">Epic #${m.epic.n} on GitHub: full scope and open questions</a>`);
    if (m.url) links.push(`<a href="${esc(m.url)}" target="_blank" rel="noopener">Milestone ${esc(m.id)} on GitHub</a>`);
    return links.length ? `<div class="gh-links">${links.join("")}</div>` : "";
  }

  function milestoneBlock(m, isCurrent) {
    const flat = m.features.flatMap((f) => f.issues);
    const left = flat.filter((i) => i.status !== "done");
    let meta;
    if (m.state === "planned") meta = m.epic ? `Scope in epic #${m.epic.n} until it's grilled into issues` : "Not broken into issues yet";
    else if (m.state === "done") meta = `All ${m.counts.total} done`;
    else if (left.length && left.every((i) => i.mine)) meta = `${m.counts.done} of ${m.counts.total} done · only your part is left`;
    else meta = `${m.counts.done} of ${m.counts.total} done · ${left.length} to go`;
    const goal = `<div class="goal">
           <div><span class="eyebrow">Goal</span><p>${esc(m.goal)}</p></div>
           <div><span class="eyebrow">Done when</span><p>${esc(m.doneWhen)}</p></div>
         </div>`;
    const body = m.state === "planned"
      ? `${goal}
         <span class="eyebrow">What it covers so far</span>
         <div class="scope">${m.sketch.map((s) => `<article class="feature"><h3>${esc(s.name)}</h3><p class="feature-about">${esc(s.about)}</p></article>`).join("")}</div>
         <p class="order-note">These become numbered features with their own issues after the grilling.</p>
         ${ghLinks(m)}`
      : `${goal}
         ${ghLinks(m)}
         <p class="order-note">Numbered in build order: each step builds on the ones before it.</p>
         <ol class="features">${m.features.map(featureStep).join("")}</ol>`;
    return `<details class="milestone" id="${esc(m.id.toLowerCase())}" ${isCurrent ? "open" : ""}>
      <summary>
        <div class="ms-head">
          <div class="ms-title">
            <span class="eyebrow">${esc(m.id)}</span>
            <h2>${esc(m.name)}</h2>
          </div>
          <span class="chev" aria-hidden="true">▾</span>
        </div>
        ${m.state === "planned" ? "" : bar(m.counts, false)}
        <div class="ms-meta"><span class="pill ${m.state}">${STATE[m.state]}</span><span class="num">${esc(meta)}</span></div>
      </summary>
      <div class="ms-body">${body}</div>
    </details>`;
  }

  function render(d) {
    const ms = d.milestones;
    const activeIdx = ms.map((m, i) => (m.state === "active" ? i : -1)).filter((i) => i >= 0);
    const currentIdx = activeIdx.length ? activeIdx[activeIdx.length - 1] : Math.max(0, ms.findIndex((m) => m.state === "planned"));
    const current = ms[currentIdx];

    const open = ms.filter((m) => m.state !== "planned").flatMap((m) => m.features.flatMap((f) => f.issues.map((i) => ({ ...i, ms: m.id }))))
      .concat(d.unmapped.map((i) => ({ ...i, label: i.title, ms: "" })))
      .filter((i) => i.status !== "done");
    const building = open.filter((i) => i.status === "building");
    const readyClaude = open.filter((i) => i.status === "ready" && !i.mine);
    const readyYou = open.filter((i) => i.status === "ready" && i.mine);

    const updated = new Date(d.generatedAt).toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" });
    const summary = current.state === "planned"
      ? `${current.id} is next: ${current.name.toLowerCase()}.`
      : `${current.id} is under way: ${current.counts.done} of ${current.counts.total} done. ${readyClaude.length} ready for Claude, ${readyYou.length} waiting on you.`;

    const list = (arr, empty) => arr.length
      ? `<ul class="issues">${arr.map(issueRow).join("")}</ul>`
      : `<p class="empty">${empty}</p>`;

    app.innerHTML = `
      <header>
        <span class="eyebrow">${esc(d.app)} · Roadmap</span>
        <h1>Where the app stands</h1>
        <p class="summary">${esc(summary)}</p>
        <p class="updated">Updated ${esc(updated)} from the GitHub issues</p>
      </header>

      <nav class="track-scroll" aria-label="Milestones">
        <ol class="track" style="--stops:${ms.length + 1}">
          ${ms.map((m, i) => `<li class="stop ${m.state}${i === currentIdx ? " current" : ""}">
            <a href="#${esc(m.id.toLowerCase())}" data-open="${esc(m.id.toLowerCase())}">
              <span class="dot">${m.state === "done" ? "✓" : ""}</span>
              <span class="stop-id">${esc(m.id)}</span>
              <span class="stop-name">${esc(m.name)}</span>
              <span class="stop-count num">${m.state === "planned" ? "Planned" : `${m.counts.done}/${m.counts.total} done`}</span>
            </a>
          </li>`).join("")}
          <li class="stop planned"><a href="#later"><span class="dot"></span><span class="stop-id">Later</span><span class="stop-name">Ideas for after M4</span></a></li>
        </ol>
      </nav>

      <section class="next" aria-labelledby="next-h">
        <h2 id="next-h">Up next</h2>
        <div class="next-groups">
          <div class="next-group"><h3><span class="icon building"></span>Being built now</h3>${list(building, "Nothing has a pull request open right now.")}</div>
          <div class="next-group"><h3><span class="icon ready"></span>Ready for Claude</h3>${list(readyClaude, "Nothing is ready: everything left is waiting on other work.")}</div>
          <div class="next-group"><h3><span class="you">You</span>Your turn</h3>${list(readyYou, "Nothing needs you right now.")}</div>
        </div>
        <div class="legend">
          <span><span class="icon done"></span>Done</span>
          <span><span class="icon building"></span>Being built, or under way</span>
          <span><span class="icon ready"></span>Ready to start</span>
          <span><span class="icon waiting"></span>Waiting on other issues</span>
          <span><span class="you">You</span>Needs you</span>
        </div>
      </section>

      ${ms.map((m, i) => milestoneBlock(m, i === currentIdx)).join("")}

      ${d.unmapped.length ? `<section class="next"><h2>Not on the map yet</h2><p class="muted">New issues that aren't placed in a milestone and feature. The next refresh will sort them.</p><ul class="issues">${d.unmapped.map(issueRow).join("")}</ul></section>` : ""}

      <section class="milestone later" id="later" style="padding:18px">
        <span class="eyebrow">Later</span>
        <h2>Ideas for after M4</h2>
        <ul class="sketch">${d.later.map((s) => `<li>${esc(s)}</li>`).join("")}</ul>
      </section>

      <footer>Built from the issues in ${esc(d.repo)} on GitHub. Refresh it with <code>/roadmap</code>.</footer>`;

    app.querySelectorAll("[data-open]").forEach((a) => a.addEventListener("click", () => {
      const el = document.getElementById(a.dataset.open);
      if (el) el.open = true;
    }));
  }

  fetch("roadmap.json", { cache: "no-store" })
    .then((r) => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(render)
    .catch(() => {
      app.insertAdjacentHTML("beforeend", '<div class="error">The roadmap data didn\'t load. Reload the page, or run <code>/roadmap</code> to publish it again.</div>');
    });
})();
</script>
